# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that.
# This file is *NOT* reloaded automatically when you use 'bundle exec jekyll serve'.
# If you change this file, please restart the server process.

# Site settings
# are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

#theme: jekyll-agency
remote_theme: raviriley/agency-jekyll-theme

url    : "https://stellarmammals.com" # the base hostname & protocol for your site, e.g. http://example.com
baseurl: "" # apex domain → empty. (Was the full domain, which the theme concatenated onto url → broken canonical tag.)
# baseurl: "/agency-jekyll-theme-starter" # the subpath of your site, e.g. /blog

title      : Stellar Mammals
email      : stellarmammals@gmail.com #this is also the email contact forms will go to
description: "Music by Stellar Mammals - Ambient relaxing music for focus and chill. Soundscapes for contemplation and sleep."
author     : Mark Koester
# logo:     #optional, defaults to site title
  # path: assets\img\clients\creative-market.jpg
  # height: 60 #height in px, defaults to 52px

locale: "en-US" # See available languages in _data/sitetext.yml

analytics:
  google: G-KNMTBHWHR2
  #Google Analytics tracking code here
  posthog: "phc_CSKYwG6TbDyiYog8A7yFsG5EWgK48dy6LXf9BeHi3obZ" # dedicated StellarMammals.com PostHog project (id 543186). Client key, safe to embed.
  posthog_host: "https://us.i.posthog.com"

collections:
  portfolio:

markdown: kramdown

# Uncomment following line to use Formspree form ID based URL instead of email based URL
# Details: https://help.formspree.io/hc/en-us/articles/360017735154-How-to-prevent-spam
# formspree_form_path: "f/a_form_id"

plugins:
  - jekyll-remote-theme
