    text: "Venice Beach music producer. Music for energy, dance, focus, and chill."
    body: "<img style='width:100%;max-width:320px;border-radius:12px;' src='../assets/img/portfolio/mark-venice-beach.jpg' alt='Mark Koester of Stellar Mammals at Venice Beach'><br/><br/>Stellar Mammals is the solo project of Venice Beach music producer Mark Koester. A producer-with-range catalog that runs from deep house with live trumpet and vocals to instrumental lofi and ambient soundscapes. Companion music for whatever you're doing.<br/><br/>The through-line is flow: showing up daily, finishing songs, and trusting there is no wrong way to make a song, and endless right ways. Forever a beginner, always becoming, always moving forwards and towards.<br/><br/>For questions, collaboration, or production work, reach out at <a href='mailto:stellarmammals@gmail.com'>stellarmammals@gmail.com</a>.<br/><br/><a href='/about.html'>More about Mark</a>. Writing and liner notes at <a href='http://www.markwk.com'>markwk.com</a>."
